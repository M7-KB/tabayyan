[project]
name = "tabayyan-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
