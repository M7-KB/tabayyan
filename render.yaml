# All environment values are entered in Render. Health-only mode needs no provider key.
services:
  - type: web
    name: tabayyan-api-v0
    runtime: python
    repo: https://github.com/M7-KB/tabayyan
    branch: main
    autoDeployTrigger: "off"
    buildCommand: python -m pip install .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: HEALTH_ONLY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BUILD_SHA
        sync: false
      - key: PYTHON_VERSION
        sync: false
