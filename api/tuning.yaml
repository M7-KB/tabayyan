# Source: SPEC.md section 5.5. Initial values; calibration is T-508a.
tuning_version: t1
card_confidence_min: 0.5
alignment_confidence_min: 0.6
retrieval_score_floor: 8.0       # Legacy raw BM25 value; not enforced until calibration/SPEC update.
retrieval_overlap_floor: 0.25    # Candidate overlap fraction; initial engineering value, uncalibrated.
retrieval_overlap_min_terms: 1  # Denominator lower bound; permits one-word and two-word lookups.
word_budget_table:              # §5.2 — no tier may exceed word_budget_ceiling in content_policy.yaml
  "4": 1                        # n <= 4 tokens
  "10": 2                       # n <= 10 tokens
  "else": 3                     # n > 10 tokens
trigger_b_min_window_tokens: 3  # Trigger B only; recalibrated after P-03 (T-508a)
